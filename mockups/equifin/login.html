<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>HERMES · Inicio de sesión (recreación)</title>
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/wght.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/wght-italic.css" />
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="equifin.css" />
  </head>
  <body class="ef-login-bg">
    <div class="ef-login-card">
      <section class="ef-login-left">
        <div class="ef-logo-lg">
          EquiFin
          <svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
            <ellipse cx="38" cy="16" rx="10" ry="6" transform="rotate(-25 38 16)" />
            <ellipse cx="22" cy="28" rx="10" ry="6" transform="rotate(-50 22 28)" />
            <ellipse cx="36" cy="40" rx="11" ry="7" transform="rotate(35 36 40)" />
            <path d="M36 34l6 12M32 36l6 11" />
            <path d="M54 30v6M51 33h6M14 46v5M11.5 48.5h5" />
          </svg>
        </div>
        <div class="ef-hermes">HERMES</div>
        <div class="ef-login-sub">Sistema de Gestión de Microfinanzas</div>
        <div class="ef-tiles">
          <div class="ef-tile"><span><i class="bi bi-cash"></i></span>Pagos</div>
          <div class="ef-tile"><span><i class="bi bi-people"></i></span>Clientes</div>
          <div class="ef-tile"><span><i class="bi bi-graph-up"></i></span>Reportes</div>
          <div class="ef-tile"><span><i class="bi bi-shield-check"></i></span>Seguro</div>
        </div>
      </section>

      <section class="ef-login-right">
        <h1>Bienvenido</h1>
        <p class="text-secondary fs-5 mb-4">Inicia sesión para acceder al sistema</p>

        <button class="btn-google" type="button">
          <svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z" />
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z" />
            <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z" />
          </svg>
          Continuar con Google
        </button>

        <div class="ef-divisor">o ingresa con tu cuenta</div>

        <div class="ef-input mb-3">
          <i class="bi bi-envelope"></i>
          <input class="form-control" type="email" placeholder="Correo electrónico" />
        </div>
        <div class="ef-input mb-3">
          <i class="bi bi-lock"></i>
          <input class="form-control" type="password" placeholder="Contraseña" />
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="recordarme" />
          <label class="form-check-label fs-6" for="recordarme">Recordarme</label>
        </div>
        <button class="btn btn-ef btn-login w-100" type="button">
          <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
        </button>
        <p class="text-center text-secondary small mt-4 mb-0">© 2026 EQUIFIN · Ixtlamatini · v2.45.0</p>
      </section>
    </div>
  </body>
</html>
