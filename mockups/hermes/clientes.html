<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>HERMES · Clientes (recreación con datos ficticios)</title>
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/wght.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/wght-italic.css" />
    <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../../node_modules/bootstrap-icons/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="hermes.css" />
  </head>
  <body>
    <nav class="hm-navbar"><span class="hm-marca"><img src="../../public/brand/icono-jade.svg" alt="" />IXT<span class="hm-producto">HERMES</span></span><span class="hm-burger"><i class="bi bi-list"></i></span></nav>

    <main class="container-fluid px-4 py-3">
      <div class="d-flex align-items-end justify-content-between mb-3">
        <div>
          <a class="btn btn-sm btn-outline-secondary mb-2"><i class="bi bi-arrow-left"></i> Menú</a>
          <h1 class="h3 mb-0"><i class="bi bi-people me-2"></i>Clientes</h1>
        </div>
        <button class="btn btn-hm"><i class="bi bi-person-plus me-1"></i> Nuevo cliente</button>
      </div>

      <div class="card mb-3">
        <div class="card-body py-3">
          <div class="row g-3 align-items-end">
            <div class="col-3">
              <label class="form-label text-secondary mb-1">Buscar</label>
              <input class="form-control" placeholder="Nombre, CURP o código..." />
            </div>
            <div class="col-2">
              <label class="form-label text-secondary mb-1">Gerente</label>
              <select class="form-select"><option>— Todos —</option></select>
            </div>
            <div class="col-2">
              <label class="form-label text-secondary mb-1">Estatus</label>
              <select class="form-select"><option>— Todos —</option></select>
            </div>
            <div class="col d-flex flex-wrap column-gap-3 row-gap-1 pb-1">
              <div class="form-check"><input class="form-check-input" type="checkbox" /><label class="form-check-label">Con advertencias</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" /><label class="form-check-label">Incompletos</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" /><label class="form-check-label">Incluir dadas de baja</label></div>
            </div>
            <div class="col-auto d-flex gap-2">
              <button class="btn btn-hm px-4"><i class="bi bi-search"></i></button>
              <button class="btn btn-outline-secondary">Limpiar</button>
            </div>
          </div>
        </div>
      </div>

      <span class="badge text-bg-dark fs-6 mb-2 px-3 py-2">Activas: 418</span>

      <table class="table table-hm">
        <thead>
          <tr>
            <th style="width: 150px">Código</th>
            <th>Nombre completo</th>
            <th>CURP</th>
            <th>Gerente</th>
            <th class="text-center">Estatus</th>
            <th class="text-center" style="width: 160px">Acciones</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </main>

    <script>
      // Todos los nombres, códigos y CURP son inventados.
      const ESTATUS = {
        prestamo: '<span class="badge text-bg-success">Activo con préstamo</span>',
        grupo:
          '<span class="badge text-bg-secondary">Cliente en grupo</span><br><span class="text-secondary me-1">↳</span><span class="badge badge-grupal mt-1"><i class="bi bi-people-fill me-1"></i>Con crédito grupal</span>',
        liquidado: '<span class="badge text-bg-primary">Activo, préstamo liquidado</span>',
      };
      const clientes = [
        ['BACA120586PK', 'AMELIA BARRERA CASTILLO', 'BACA860512MPLRSM04', 'Sofía Méndez Rangel', 'prestamo'],
        ['CAIA270391QD', 'ANDREA CAMPOS IBARRA', 'CAIA910327MDFMBN07', 'Héctor Salinas Fuentes', 'grupo'],
        ['DUMA081179RT', 'ANGÉLICA DURÁN MORALES', 'DUMA791108MMCRRN02', 'Héctor Salinas Fuentes', 'prestamo'],
        ['EIVA190788LM', 'ARACELI ESPINOZA VEGA', 'EIVA880719MPLSGR05', 'Paola Ríos Calderón', 'grupo'],
        ['FONB300195XW', 'BEATRIZ FLORES NAVA', 'FONB950130MTLLVT03', 'Tomás Aguirre León', 'grupo', true],
        ['GAOB140983JH', 'BRENDA GALVÁN ORTIZ', 'GAOB830914MDFLRR06', 'Tomás Aguirre León', 'grupo', true],
        ['HUSC021290ZP', 'CAROLINA HUERTA SOTO', 'HUSC901202MMCRTR08', 'Paola Ríos Calderón', 'liquidado'],
        ['IIPC210476NB', 'CLAUDIA IRIARTE PEÑA', 'IIPC760421MPLRXL01', 'Sofía Méndez Rangel', 'prestamo'],
        ['JULD110601KS', 'DANIELA JUÁREZ LUNA', 'JULD010611MDFRNNA9', 'Héctor Salinas Fuentes', 'grupo'],
      ];
      document.getElementById('filas').innerHTML = clientes
        .map(
          ([codigo, nombre, curp, gerente, estatus, incompleto]) => `
          <tr>
            <td><span class="hm-code">${codigo}</span></td>
            <td>${nombre}${incompleto ? '<br><span class="badge text-bg-warning mt-1"><i class="bi bi-exclamation-triangle me-1"></i>Incompleto</span>' : ''}</td>
            <td>${curp}</td>
            <td>${gerente}</td>
            <td class="text-center">${ESTATUS[estatus]}</td>
            <td class="text-center hm-acciones">
              <button class="btn btn-outline-primary"><i class="bi bi-eye"></i></button>
              <button class="btn btn-outline-secondary"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-outline-danger"><i class="bi bi-trash"></i></button>
            </td>
          </tr>`,
        )
        .join('');
    </script>
  </body>
</html>
